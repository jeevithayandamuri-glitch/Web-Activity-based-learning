<!DOCTYPE html>
<html>
<head>
    <style>
        body {
                font-family: Arial, sans-serif;
                background-color: #f2f2f2;
                margin:30px;
                padding:30px;
                background-image: url("https://img.magnific.com/premium-photo/sunrise-sojourn-vintage-train-scenic-bridge_1021867-121681.jpg?semt=ais_hybrid&w=740&q=80");
                background-repeat:no-repeat;
                background-size: cover;
                color:azure;
            }
            p{text-align:center;
            color:pink}
            h1 {
                text-align: center;
                color:red;
            }
            form {
                max-width: 1000px;
                margin: 10px auto;
                padding: 10px;
                border-radius: 0.5px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            }
            label {
                display: block;
                margin-bottom: 5px;
                font-weight: bold;
            }
            input[type="submit"] {
                background-color: #4CAF50;
                color: white;
                padding: 10px 15px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                text-align: center;
            }
            input[type="submit"]:hover {
                background-color: #45a049;
            }
            .button{
        background-color:#45a049;
        border-radius:5px;
        color:aliceblue;
        border:3px solid black;
        font-size:x-large;
    }
    </style>
<title>train</title>
</head>
<body>
<h1 align="center">Train</h1>
<form>
            <lable> first name:</lable><br>
            <input type ="text" name="first name"><br>
            <lable> last name:</lable><br>
            <input type ="text" name="last name"><br>
            <lable> email:</lable><br>
            <input type ="email" name="email"><br>
            <lable> phone number:</lable><br>
            <input type ="tel" name="phone number"><br>
            <lable>date of travel:</lable><br>
            <input type ="date" name="date of travel"><br>
            <lable>number of tickets:</lable><br>
            <input type ="number" name="number of tickets"><br>
            <lable>from:</lable><br>
            <input type ="text" name="from"><br>
            <lable>to:</lable><br>
            <input type ="text" name="to"><br>
            <lable> class:</lable><br><br>
            <input type ="radio" name="first class" value="first"> First Class<br>
            <input type ="radio" name="second class" value="second"> Second Class<br>
            <input type ="radio" name="third class" value="third"> Third Class<br>
            <lable>no.of passengers:</lable><br>
            <input type ="number" name="no.of passengers"><br>
            <lable>payment method:</lable><br>
            <select name="payment method">
                <option value="credit card">Credit Card</option><br>
                <option value="debit card">Debit Card</option><br>
                <option value="net banking">Net Banking</option><br>
                <option value="upi">UPI</option><br><br>
            <br></select><br>
            <input type="submit" value="Book Now"><br><br>
            <input type="reset" value="Reset"><br>
</form>

</html>
